name: CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  # Two Windows legs, because the .NET Framework fixtures make the Visual Studio on the image
  # load-bearing rather than incidental. `windows-latest` is now the VS-2026-only image (VS
  # Enterprise 18.x, no VS 2022 and no Build Tools 17 anywhere on it), and a non-SDK-style project in
  # the 2003 MSBuild XML namespace is exactly what MsBuildBootstrap's VS 16/17 preference has nothing
  # to prefer on there. `windows-2022` is the leg that gives the suite a VS 17 machine, so the
  # README's legacy claim stays proven under CI — and keeping `windows-latest` in the matrix is what
  # keeps the VS 2026 gap exposed rather than hidden.
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, windows-2022, macos-latest]

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'

      # Restore/build/test the whole solution, not just the test project: the self-spec
      # tests open the real Zphil.LoadBearing.slnx through MSBuildWorkspace, so building the
      # entire solution is what guarantees the workspace resolves at test time. CI=true (set
      # by GitHub Actions) also puts NuGet restore in locked mode for the six lock-file
      # projects, while the throwaway fixture projects restore unlocked by design.
      - name: Restore
        run: dotnet restore Zphil.LoadBearing.slnx

      - name: Build
        run: dotnet build Zphil.LoadBearing.slnx --no-restore

      - name: Test
        run: dotnet test Zphil.LoadBearing.slnx --no-build --logger "console;verbosity=normal"

  # Packs on Linux, then does two things with the result. First, asserts the MCP manifest lands at
  # exactly `.mcp/server.json` — the path nuget.org scans to generate the VS Code MCP config. A
  # backslash PackagePath mis-packs only on non-Windows (the `.mcp//server.json` double-slash class
  # of bug), so a single ubuntu job — not the 3-OS matrix — is the leg that catches it. Second,
  # installs the packed tool and walks the README quickstart, which is the one shipped path this
  # repository never took itself.
  pack-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'

      - name: Pack
        run: dotnet pack Zphil.LoadBearing.slnx -c Release -o artifacts

      # Target the Cli package explicitly: the solution pack emits four nupkgs and only the
      # Cli one carries the MCP manifest. A bare artifacts/*.nupkg glob would hand unzip four
      # files and break, so glob the single Cli package here.
      - name: Verify server.json is packed at .mcp/server.json
        run: |
          entries="$(unzip -Z1 artifacts/Zphil.LoadBearing.Cli.*.nupkg)"
          grep -Fxq '.mcp/server.json' <<<"$entries" || {
            echo "::error::MCP manifest missing or mis-pathed in the packed nupkg (need .mcp/server.json)"
            printf '%s\n' "$entries" | grep -i 'server\.json' || true
            exit 1
          }

      # The README quickstart is `dotnet tool install -g Zphil.LoadBearing.Cli` then `loadbearing
      # check <solution>`, and nothing anywhere executed it: CI drives the CLI through `dotnet run`,
      # the agent hook through `dotnet exec`, and there is no tool manifest. So the one path every
      # new user takes was the one path this repository never took. This installs the nupkg packed
      # above and walks the published lines.
      #
      # The version is read from Directory.Build.props rather than written out, so a release bump
      # cannot quietly stop pinning. --add-source puts the local pack in front of nuget.org, which
      # is still needed for the third-party dependencies, so the pin alone does not prove which
      # build ran once this version is also published — the informational version does.
      # `<version>+<commit>` is the format SECURITY.md documents as the source cross-check, and
      # holding it to this commit's SHA is what makes this a test of the tool just packed rather
      # than of whatever nuget.org happens to serve.
      #
      # Meridian.Quoting is the target because it is small, Enforce-only, and carries no baselines,
      # so a green exit is the rules passing and nothing else.
      - name: Install the packed tool and run the README quickstart
        run: |
          version="$(sed -n 's:.*<Version>\(.*\)</Version>.*:\1:p' Directory.Build.props | head -n 1)"
          dotnet tool install -g Zphil.LoadBearing.Cli --add-source artifacts --version "$version"
          export PATH="$PATH:$HOME/.dotnet/tools"
          # Substring, not a whole-line match: the CLI's console writes CRLF on Windows, and a
          # verification of this same line by hand there would fail on the trailing \r for no reason.
          expected="$version+$(git rev-parse HEAD)"
          loadbearing --version | grep -Fq "$expected" || {
            echo "::error::loadbearing --version is not '$expected' — the tool that ran is not the one packed above"
            loadbearing --version
            exit 1
          }
          dotnet build examples/Meridian.Quoting/Meridian.Quoting.slnx
          loadbearing check examples/Meridian.Quoting/Meridian.Quoting.slnx

  # Self-scan: LoadBearing checks its own solution and publishes the result to GitHub code
  # scanning as SARIF. The self-spec exits 0 today, so the job is green; a future violation
  # reddens the check step and the alerts still upload (if: always()). Forked-PR and
  # Dependabot runs lack the security-events token, so the upload is guarded off for them.
  self-check:
    runs-on: ubuntu-latest
    permissions:
      contents: read           # checkout
      security-events: write   # upload SARIF to code scanning
    steps:
      # fetch-depth: 0 so origin/main exists as a local ref for --diff-base below; the default
      # single-commit checkout leaves nothing to diff against.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'
      # Build the whole solution (CLI + the arch spec) so --no-build can run the check over
      # the real MSBuildWorkspace, exactly as build-and-test does. --spec is explicit: the
      # self-solution has many Core-referencing members, so the one-spec convention cannot
      # pick (the self-spec test passes the same path).
      - name: Build
        run: dotnet build Zphil.LoadBearing.slnx
      # --diff-base arms the Quarantine tripwire: a change set touching roslyn/msbuild-bootstrap
      # draws a warning naming the file, which is the recommended CI shape and the one this
      # repository owed its own quarantined scope. Without the flag the tripwire reports skipped
      # on every run. Warnings never move the exit code, so this cannot redden CI on its own;
      # containment, which needs no diff, already could. On a push to main origin/main is HEAD
      # and the diff is empty; on a pull request it is the base tip, so the warning covers
      # exactly the proposed change.
      - name: Check self and emit SARIF
        run: dotnet run --no-build --project src/Zphil.LoadBearing.Cli -- check Zphil.LoadBearing.slnx --spec arch/Zphil.LoadBearing.ArchSpec/Zphil.LoadBearing.ArchSpec.csproj --diff-base origin/main --sarif loadbearing.sarif
      # The same self-spec through the xUnit adapter, as its own step so the log reads one line per rule
      # ID — the run the landing page's xUnit beat links. The 3-OS matrix already runs these tests inside
      # the full suite; this leg exists to be readable, not to add coverage.
      - name: Self-spec as named xUnit tests (one test per rule)
        run: dotnet test tests/Zphil.LoadBearing.Tests/Zphil.LoadBearing.Tests.csproj --no-build --filter "FullyQualifiedName~AdapterSelfSpecTests" --logger "console;verbosity=normal"
      # Render this repo's own spec and require a zero diff — the same provably-current property the
      # examples job holds, now over the root block, the diagram, and the whole class of per-directory
      # cards. The command is character-for-character the one ARCHITECTURE.md publishes as the way to
      # redraw it, so the documented reproduce line is an executed one rather than a claim. The diff is
      # unscoped on purpose: a card placed somewhere nobody predicted still has to be committed, and a
      # path list here would quietly stop covering it. Cost: render pays two extractions (scoped cards,
      # then the diagram with no project exclusions) on top of check's one. Accepted — this is the only
      # leg that runs `render` against this solution at all.
      - name: Render self and assert a single zero diff
        run: |
          dotnet run --no-build --project src/Zphil.LoadBearing.Cli -- render Zphil.LoadBearing.slnx \
            --spec arch/Zphil.LoadBearing.ArchSpec/Zphil.LoadBearing.ArchSpec.csproj \
            --diagram ARCHITECTURE.md \
            --diagram-only "Zphil.LoadBearing;Zphil.LoadBearing.Cli;Zphil.LoadBearing.Roslyn;Zphil.LoadBearing.Xunit;Zphil.LoadBearing.Packs.DotNet;Zphil.LoadBearing.ArchSpec"
          git diff --exit-code
      # The read verbs, against this solution. `check` used to be the only command that ever ran on this
      # repository under any gate; a shipped verb nobody points at its own codebase is a verb whose first
      # real consumer is a stranger. With render above, that leaves only `baseline`, which stays out
      # deliberately — it is the human escape valve, and a gate that ran it would be moving the ratchet.
      # Exit 0 is the whole assertion — `status` always exits 0 by design, and `explain` needs no
      # workspace — so this is a smoke test, not a second check.
      - name: Read verbs against this solution (status, graph, explain)
        run: |
          dotnet run --no-build --project src/Zphil.LoadBearing.Cli -- status Zphil.LoadBearing.slnx --spec arch/Zphil.LoadBearing.ArchSpec/Zphil.LoadBearing.ArchSpec.csproj
          dotnet run --no-build --project src/Zphil.LoadBearing.Cli -- graph Zphil.LoadBearing.slnx
          dotnet run --no-build --project src/Zphil.LoadBearing.Cli -- explain layering/model-independent Zphil.LoadBearing.slnx --spec arch/Zphil.LoadBearing.ArchSpec/Zphil.LoadBearing.ArchSpec.csproj
      - name: Upload SARIF to code scanning
        if: always() && (github.event_name != 'pull_request' || (!github.event.pull_request.head.repo.fork && github.actor != 'dependabot[bot]'))
        uses: github/codeql-action/upload-sarif@e4fba868fa4b1b91e1fdab776edc8cfbe6e9fb81 # v4.37.3
        with:
          sarif_file: loadbearing.sarif
          category: loadbearing

  # Provably-current examples: build each example solution, run `check` (exit 0 on the
  # committed baselines), then re-run `render` for all of them and assert a single zero diff
  # across examples/ — root blocks AND the scoped per-directory cards. If a spec drifts from
  # its example code, this job fails. The Meridian.Quoting on-ramp also runs its xUnit
  # adapter (one named test per rule). Ubuntu-only initially.
  examples:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'
      # The CLI never builds the target; build the example solutions first. Examples restore
      # unlocked (no lock policy under examples/); CLI/src restore locked via committed lock files.
      - name: Build the Meridian example solution
        run: dotnet build examples/Meridian/Meridian.slnx
      - name: Build the Meridian.Quoting example solution
        run: dotnet build examples/Meridian.Quoting/Meridian.Quoting.slnx
      - name: Build the Meridian.Operations example solution
        run: dotnet build examples/Meridian.Operations/Meridian.Operations.slnx
      - name: Build the Meridian.Interchange example solution
        run: dotnet build examples/Meridian.Interchange/Meridian.Interchange.slnx
      - name: Build the LoadBearing CLI
        run: dotnet build src/Zphil.LoadBearing.Cli/Zphil.LoadBearing.Cli.csproj
      - name: Check Meridian (expect exit 0 on the committed baselines)
        run: dotnet run --no-build --project src/Zphil.LoadBearing.Cli -- check examples/Meridian/Meridian.slnx
      - name: Check Meridian.Quoting (expect exit 0; Enforce-only, no baselines)
        run: dotnet run --no-build --project src/Zphil.LoadBearing.Cli -- check examples/Meridian.Quoting/Meridian.Quoting.slnx
      - name: Check Meridian.Operations (expect exit 0 on the committed containment baseline)
        run: dotnet run --no-build --project src/Zphil.LoadBearing.Cli -- check examples/Meridian.Operations/Meridian.Operations.slnx
      - name: Check Meridian.Interchange (expect exit 0 on the committed baseline)
        run: dotnet run --no-build --project src/Zphil.LoadBearing.Cli -- check examples/Meridian.Interchange/Meridian.Interchange.slnx
      # No --no-build here: the adapter test project is not a member of any slnx, so nothing
      # above builds it. dotnet test restores and builds it (and the Xunit adapter it references).
      - name: Test the Meridian.Quoting xUnit adapter (one named test per rule)
        run: dotnet test examples/Meridian.Quoting/tests/Meridian.Quoting.ArchTests/Meridian.Quoting.ArchTests.csproj --logger "console;verbosity=normal"
      - name: Render all four and assert a single zero diff (the provably-current property)
        run: |
          dotnet run --no-build --project src/Zphil.LoadBearing.Cli -- render examples/Meridian/Meridian.slnx
          dotnet run --no-build --project src/Zphil.LoadBearing.Cli -- render examples/Meridian.Quoting/Meridian.Quoting.slnx
          dotnet run --no-build --project src/Zphil.LoadBearing.Cli -- render examples/Meridian.Operations/Meridian.Operations.slnx
          dotnet run --no-build --project src/Zphil.LoadBearing.Cli -- render examples/Meridian.Interchange/Meridian.Interchange.slnx
          git diff --exit-code -- examples/
