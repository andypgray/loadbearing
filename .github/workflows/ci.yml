name: CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  # Two Windows legs, because the .NET Framework fixtures make the Visual Studio on the image
  # load-bearing rather than incidental. `windows-latest` is now the VS-2026-only image (VS
  # Enterprise 18.x, no VS 2022 and no Build Tools 17 anywhere on it), and a non-SDK-style project in
  # the 2003 MSBuild XML namespace is exactly what MsBuildBootstrap's VS 16/17 preference has nothing
  # to prefer on there. `windows-2022` is the leg that gives the suite a VS 17 machine, so the
  # README's legacy claim stays proven under CI — and keeping `windows-latest` in the matrix is what
  # keeps the VS 2026 gap exposed rather than hidden.
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, windows-2022, macos-latest]

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'

      # Dependabot bumps a PackageReference and leaves packages.lock.json alone, so a NuGet update
      # PR arrives failing NU1004 at Restore, before a single test runs — a red check that says
      # nothing about the bump it was raised for. Relocking first means everything below tests what
      # Dependabot actually proposed. The same step runs in pack-check, self-check and examples; the
      # rationale lives here only, so the four copies cannot drift apart in wording.
      #
      # Solution-wide, because the staleness ripples: a version change in one project rewrites the
      # lock file of every project that references it transitively, and Dependabot updates one
      # directory at a time, so nothing scoped to the bumped project could be right. Four details
      # carry weight:
      #
      #   - shell: bash, because this matrix includes Windows, where run: defaults to pwsh and the
      #     `||` below would not parse.
      #   - CI: '' is scoped to this step alone, so only this restore leaves locked mode; every
      #     build, test and pack step after it still sees CI=true. RestorePackagesWithLockFile is
      #     unconditional, so the lock files are rewritten rather than ignored.
      #   - The commit is local and never pushed. A GITHUB_TOKEN push could not re-trigger the PR's
      #     checks anyway, and a standing write credential is a poor trade for a weekly convenience
      #     PR. It exists so the tree is clean for the unscoped `git diff --exit-code` gate in
      #     self-check, so pack-check's `<version>+<commit>` assertion still names the commit
      #     SourceLink embedded, and so nothing packs from a dirty tree.
      #   - head_ref, not actor: head_ref is empty on push, so main is untouched; a maintainer
      #     re-running the workflow gets the same answer; and a github-actions bump does not pay for
      #     a restore it has no use for.
      #
      # The PR still cannot reach all-green by itself. The lock-files job below stays red until a
      # human puts the relock commit on the branch, which is the one signal worth acting on.
      - name: Regenerate NuGet lock files (Dependabot NuGet PRs)
        if: startsWith(github.head_ref, 'dependabot/nuget/')
        shell: bash
        env:
          CI: ''
        run: |
          dotnet restore Zphil.LoadBearing.slnx --force-evaluate
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- '*packages.lock.json'
          git diff --cached --quiet || git commit -q -m 'Regenerate NuGet lock files'

      # Restore/build/test the whole solution, not just the test project: the self-spec
      # tests open the real Zphil.LoadBearing.slnx through MSBuildWorkspace, so building the
      # entire solution is what guarantees the workspace resolves at test time. CI=true (set
      # by GitHub Actions) also puts NuGet restore in locked mode for the six lock-file
      # projects, while the throwaway fixture projects restore unlocked by design.
      - name: Restore
        run: dotnet restore Zphil.LoadBearing.slnx

      - name: Build
        run: dotnet build Zphil.LoadBearing.slnx --no-restore

      - name: Test
        run: dotnet test Zphil.LoadBearing.slnx --no-build --logger "console;verbosity=normal"

  # Packs on Linux, then does two things with the result. First, asserts the MCP manifest lands at
  # exactly `.mcp/server.json` — the path nuget.org scans to generate the VS Code MCP config. A
  # backslash PackagePath mis-packs only on non-Windows (the `.mcp//server.json` double-slash class
  # of bug), so a single ubuntu job — not the 3-OS matrix — is the leg that catches it. Second,
  # installs the packed tool and walks the README quickstart, which is the one shipped path this
  # repository never took itself.
  pack-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'

      # Relock for Dependabot NuGet PRs, so the pack below is of the bump rather than of a failed
      # restore. Identical text in build-and-test, which carries the rationale.
      - name: Regenerate NuGet lock files (Dependabot NuGet PRs)
        if: startsWith(github.head_ref, 'dependabot/nuget/')
        shell: bash
        env:
          CI: ''
        run: |
          dotnet restore Zphil.LoadBearing.slnx --force-evaluate
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- '*packages.lock.json'
          git diff --cached --quiet || git commit -q -m 'Regenerate NuGet lock files'

      - name: Pack
        run: dotnet pack Zphil.LoadBearing.slnx -c Release -o artifacts

      # Target the Cli package explicitly: the solution pack emits four nupkgs and only the
      # Cli one carries the MCP manifest. A bare artifacts/*.nupkg glob would hand unzip four
      # files and break, so glob the single Cli package here.
      - name: Verify server.json is packed at .mcp/server.json
        run: |
          entries="$(unzip -Z1 artifacts/Zphil.LoadBearing.Cli.*.nupkg)"
          grep -Fxq '.mcp/server.json' <<<"$entries" || {
            echo "::error::MCP manifest missing or mis-pathed in the packed nupkg (need .mcp/server.json)"
            printf '%s\n' "$entries" | grep -i 'server\.json' || true
            exit 1
          }

      # The README quickstart is `dotnet tool install -g Zphil.LoadBearing.Cli` then `loadbearing
      # check <solution>`, and nothing anywhere executed it: CI drives the CLI through `dotnet run`,
      # the agent hook through `dotnet exec`, and there is no tool manifest. So the one path every
      # new user takes was the one path this repository never took. This installs the nupkg packed
      # above and walks the published lines.
      #
      # The version is read from Directory.Build.props rather than written out, so a release bump
      # cannot quietly stop pinning. --add-source puts the local pack in front of nuget.org, which
      # is still needed for the third-party dependencies, so the pin alone does not prove which
      # build ran once this version is also published — the informational version does.
      # `<version>+<commit>` is the format SECURITY.md documents as the source cross-check, and
      # holding it to this commit's SHA is what makes this a test of the tool just packed rather
      # than of whatever nuget.org happens to serve.
      #
      # Meridian.Quoting is the target because it is small, Enforce-only, and carries no baselines,
      # so a green exit is the rules passing and nothing else.
      - name: Install the packed tool and run the README quickstart
        run: |
          version="$(sed -n 's:.*<Version>\(.*\)</Version>.*:\1:p' Directory.Build.props | head -n 1)"
          dotnet tool install -g Zphil.LoadBearing.Cli --add-source artifacts --version "$version"
          export PATH="$PATH:$HOME/.dotnet/tools"
          # Substring, not a whole-line match: the CLI's console writes CRLF on Windows, and a
          # verification of this same line by hand there would fail on the trailing \r for no reason.
          expected="$version+$(git rev-parse HEAD)"
          loadbearing --version | grep -Fq "$expected" || {
            echo "::error::loadbearing --version is not '$expected' — the tool that ran is not the one packed above"
            loadbearing --version
            exit 1
          }
          dotnet build examples/Meridian.Quoting/Meridian.Quoting.slnx
          loadbearing check examples/Meridian.Quoting/Meridian.Quoting.slnx

      # Above proves the tool. Nothing proves the package a spec project actually references.
      # `derive_spec` hands every adopter a spec csproj built on
      # `<PackageReference Include="Zphil.LoadBearing" ... />`, and not one spec in this tree is built
      # that way: the four examples, the self-spec and every fixture use a ProjectReference. So spec
      # discovery — the unique declared solution member whose reference paths hold a
      # Zphil.LoadBearing.dll — has only ever run here against a project reference, while a metadata
      # reference into the packages folder is what every reader gets. This scaffolds the reader's tree
      # out of the pack above and checks it. It is also the first time anything compiles the scaffold
      # the recipe publishes.
      #
      # The csproj and the spec class are cut from the recipe rather than written here, and the csproj
      # gets the same Version="..." substitution ArchPrompts applies when the server serves the
      # prompt. So this executes the published recipe instead of a copy that could drift from it, and
      # a recipe edit that breaks the scaffold reddens here rather than reaching a reader. The cut is
      # anchored on content rather than on fence order, and an empty cut is a loud failure: a
      # restructure must redden this leg, never quietly scaffold nothing.
      #
      # One rule is authored here, in its own file, because the recipe's Define() is empty by design
      # and a spec with no rules would prove loading and evaluate nothing. A second spec class is the
      # honest seam — the model runs every IArchitectureSpec in the assembly over one shared Arch — so
      # the recipe's own file stays byte for byte what it publishes, and the csproj, the artifact
      # actually under test, is untouched.
      #
      # Under $RUNNER_TEMP, outside the working tree: nothing inherits this repository's
      # Directory.Build.props (which would stamp its version, binding identity and package metadata
      # onto the scaffold), and nothing lands where a git gate could see it. NUGET_PACKAGES is
      # scaffold-local and the only feed is the local pack, so the restore cannot be answered by a
      # copy of this version already on the machine or on nuget.org — which is the whole difference
      # between testing the bytes packed above and testing whatever is published. Debug, not Release:
      # the sibling-configuration fallback in spec resolution is a separate property, and a red here
      # should mean exactly one thing.
      #
      # Then the negative control, because loading is not enforcing. A non-conforming interface goes
      # into the product, it is rebuilt, and `check` must exit exactly 1. Not merely non-zero: exit 2
      # is an unresolved spec or a workspace that failed to load, which would satisfy a "non-zero"
      # test for precisely the reason this leg exists to rule out.
      #
      # The whole thing then runs a second time against a repository that manages package versions
      # centrally — a large and growing class of modern .NET repositories, and the shape the scaffold
      # was invalid on until it carried `ManagePackageVersionsCentrally`: an inline version on a
      # PackageReference is NU1008 there, an error whose text never mentions this tool. The recipe
      # opts its one project out rather than telling the adopter to edit a central file they may
      # treat as protected, and this leg is what stops that from being prose. Its own negative
      # control strips the opt-out and requires NU1008 back — not merely a failure, since any other
      # error would satisfy a bare non-zero test for the reason the control exists to rule out.
      - name: Scaffold the documented PackageReference spec project — plain and CPM — and check it
        run: |
          version="$(sed -n 's:.*<Version>\(.*\)</Version>.*:\1:p' Directory.Build.props | head -n 1)"
          export PATH="$PATH:$HOME/.dotnet/tools"

          recipe="src/Zphil.LoadBearing.Cli/Mcp/Prompts/derive-spec.md"
          plain="$RUNNER_TEMP/packageref"
          cpm="$RUNNER_TEMP/packageref-cpm"
          # One package folder for both legs: warm for the second, and still isolated from the machine
          # cache and from nuget.org, which is what makes the restore assertion below name the pack.
          export NUGET_PACKAGES="$plain/.packages"

          # The first fenced block in <lang> whose body carries <marker>. Content-anchored rather than
          # positional, so re-ordering the recipe's fences can never select the wrong one; a marker
          # that has gone yields nothing and trips the guard below.
          fence() {
            awk -v want="$1" -v marker="$2" '
              /^```/ {
                if (!open) { open = 1; lang = substr($0, 4); sub(/[ \t]+$/, "", lang); body = ""; next }
                open = 0
                if (lang == want && index(body, marker) > 0) { printf "%s", body; exit }
                next
              }
              open { body = body $0 "\n" }
            ' "$recipe"
          }

          csproj="$(fence xml 'PackageReference Include="Zphil.LoadBearing"')"
          spec="$(fence csharp 'IArchitectureSpec')"
          [ -n "$csproj" ] && [ -n "$spec" ] || {
            echo "::error::Could not cut the spec scaffold out of $recipe — the xml fence carrying the PackageReference, or the csharp fence carrying the IArchitectureSpec class, has moved or changed shape. That recipe is what adopters follow, so fix it or fix this cut; do not delete the assertion."
            exit 1
          }

          # The Version="..." substitution ArchPrompts applies when it serves the prompt, done once so
          # both legs scaffold the identical csproj an adopter is handed.
          csproj="$(printf '%s\n' "$csproj" | sed 's|Version="\.\.\."|Version="'"$version"'"|')"

          # scaffold <root> — the reader's tree, written under <root>. The body is deliberately not
          # indented: these heredocs are quoted (<<'CS', never <<-), so every terminator has to reach
          # column 0 once YAML strips this block's indentation.
          scaffold() {
          mkdir -p "$1/src/MyApp" "$1/arch/MyApp.ArchSpec"
          printf '%s\n' "$csproj" > "$1/arch/MyApp.ArchSpec/MyApp.ArchSpec.csproj"
          printf '%s\n' "$spec" > "$1/arch/MyApp.ArchSpec/ArchSpec.cs"

          # The same line DeriveSpecPromptTests pins the served prompt to, asserted from the other
          # side: the csproj under test is the one an adopter is handed, pinned to the pack above.
          grep -Fq "<PackageReference Include=\"Zphil.LoadBearing\" Version=\"$version\" />" \
            "$1/arch/MyApp.ArchSpec/MyApp.ArchSpec.csproj" || {
            echo "::error::The scaffold csproj did not come out pinned to $version — the Version=\"...\" placeholder ArchPrompts substitutes is no longer where the recipe spells it"
            cat "$1/arch/MyApp.ArchSpec/MyApp.ArchSpec.csproj"
            exit 1
          }

          cat > "$1/arch/MyApp.ArchSpec/CheckedRule.cs" <<'CS'
          using Zphil.LoadBearing;

          namespace MyApp.ArchSpec;

          public sealed class PackageReferenceProof : IArchitectureSpec
          {
              public void Define(Arch arch)
              {
                  arch.Rule("naming/interfaces")
                      .Enforce(arch.Project("MyApp").OfKind(TypeKind.Interface).MustHavePrefix("I"))
                      .Because("The scaffolded spec has to evaluate over real symbols for a green run to mean anything, so it states the one convention the product below obeys and the violation below breaks.");
              }
          }
          CS

          cat > "$1/src/MyApp/MyApp.csproj" <<'CSPROJ'
          <Project Sdk="Microsoft.NET.Sdk">
              <PropertyGroup>
                  <TargetFramework>net10.0</TargetFramework>
              </PropertyGroup>
          </Project>
          CSPROJ

          cat > "$1/src/MyApp/Shipments.cs" <<'CS'
          namespace MyApp;

          public interface IShipmentPort
          {
              string Describe();
          }

          public sealed class ShipmentPort : IShipmentPort
          {
              public string Describe() => "shipment";
          }
          CS

          cat > "$1/MyApp.slnx" <<'SLNX'
          <Solution>
            <Folder Name="/src/">
              <Project Path="src/MyApp/MyApp.csproj" />
            </Folder>
            <Folder Name="/arch/">
              <Project Path="arch/MyApp.ArchSpec/MyApp.ArchSpec.csproj" />
            </Folder>
          </Solution>
          SLNX

          cat > "$1/nuget.config" <<CONFIG
          <?xml version="1.0" encoding="utf-8"?>
          <configuration>
              <packageSources>
                  <clear />
                  <add key="local-pack" value="$GITHUB_WORKSPACE/artifacts" />
              </packageSources>
          </configuration>
          CONFIG
          }

          # ── Leg A: a repository that pins package versions per project ──────────────────────────
          scaffold "$plain"
          dotnet build "$plain/MyApp.slnx"

          # Restored from the pack, not resolved from a project: the path is the assertion.
          dll="$NUGET_PACKAGES/zphil.loadbearing/$version/lib/netstandard2.0/Zphil.LoadBearing.dll"
          [ -f "$dll" ] || {
            echo "::error::The scaffold's PackageReference did not restore the contract library from the local pack (expected zphil.loadbearing/$version/lib/netstandard2.0/Zphil.LoadBearing.dll)"
            find "$NUGET_PACKAGES" -name 'Zphil.LoadBearing.dll' || true
            exit 1
          }

          # No --spec: convention discovery is the documented path and the thing under test.
          loadbearing check "$plain/MyApp.slnx" || {
            echo "::error::A spec project consuming Zphil.LoadBearing as a PackageReference — the shape derive_spec publishes — was not discovered, or did not pass over conforming code"
            exit 1
          }

          cat > "$plain/src/MyApp/Broken.cs" <<'CS'
          namespace MyApp;

          public interface ShipmentPortWithoutThePrefix
          {
          }
          CS
          dotnet build "$plain/MyApp.slnx"
          rc=0
          loadbearing check "$plain/MyApp.slnx" || rc=$?
          [ "$rc" -eq 1 ] || {
            echo "::error::check exited $rc over a deliberate violation; 1 is the only right answer (2 means the spec or the workspace did not resolve, which would make the green above meaningless)"
            exit 1
          }

          # ── Leg B: the same csproj on a repository that manages versions centrally ──────────────
          scaffold "$cpm"
          cat > "$cpm/Directory.Packages.props" <<'PROPS'
          <Project>
              <PropertyGroup>
                  <ManagePackageVersionsCentrally>true</ManagePackageVersionsCentrally>
              </PropertyGroup>
          </Project>
          PROPS

          dotnet build "$cpm/MyApp.slnx" || {
            echo "::error::The scaffold csproj did not restore or build on a repository carrying a Directory.Packages.props — the shape derive_spec publishes has to be valid there, and valid without the adopter editing that file"
            exit 1
          }
          loadbearing check "$cpm/MyApp.slnx" || {
            echo "::error::The scaffolded spec project built under central package management but was not discovered, or did not pass over conforming code"
            exit 1
          }

          # Leg B's negative control: strip the opt-out back out and the build must fail with NU1008.
          sed -i '/<ManagePackageVersionsCentrally>/d' "$cpm/arch/MyApp.ArchSpec/MyApp.ArchSpec.csproj"
          rc=0
          dotnet build "$cpm/MyApp.slnx" > "$RUNNER_TEMP/cpm-without-opt-out.log" 2>&1 || rc=$?
          if [ "$rc" -eq 0 ] || ! grep -q NU1008 "$RUNNER_TEMP/cpm-without-opt-out.log"; then
            echo "::error::Removing ManagePackageVersionsCentrally from the scaffold csproj did not produce NU1008 (build exited $rc) — that line is no longer what makes the published scaffold valid under central package management, so the leg above proves nothing"
            cat "$RUNNER_TEMP/cpm-without-opt-out.log"
            exit 1
          fi

  # The one thing release.yml structurally cannot check. It cross-checks the tag against
  # `Directory.Build.props` and both `.mcp/server.json` fields — but only at tag time, so nothing
  # looks at the window between a bumped manifest landing on `main` and the tag arriving behind it.
  # That window is not hypothetical: at 0.3.0 the bump reached the public branch, the tag never
  # followed, and for weeks the manifest nuget.org scans told every MCP registry client to fetch a
  # package version that 404s.
  #
  # The property held here is the reader's, not the maintainer's: a version this repository
  # advertises must be one a stranger can actually resolve. Either nuget.org already serves it, or
  # the tag that publishes it is in this repository — which is why the release flow pushes both refs
  # in one command (`git push origin main v<x.y.z>`), so the tag is on the server before this job
  # checks out. A bump pushed alone is exactly the state this reddens on.
  #
  # fetch-depth: 0 is load-bearing: the default single-commit checkout fetches no tags, so every
  # released version would read as untagged and the job would ask nuget.org about all of them.
  manifest-version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      # Three outcomes, deliberately worded apart. A manifest defect names the fix; a registry that
      # could not be reached says so and asks for a re-run, because a network blip that reads as a
      # manifest defect trains people to ignore this job. Whether the two version fields agree with
      # each other and with the props file is ManifestVersionTests' question, not this one — but the
      # cheap half of it is repeated here so a partial bump cannot be answered about the wrong field.
      - name: The advertised version is published, or tagged for publication
        run: |
          version="$(jq -r '.version' .mcp/server.json)"
          package="$(jq -r '.packages[0].version' .mcp/server.json)"
          if [ "$version" != "$package" ]; then
            echo "::error::.mcp/server.json advertises $version at .version and $package at .packages[0].version. A registry client reads both, so a half-finished bump points it at two different packages."
            exit 1
          fi

          if git rev-parse -q --verify "refs/tags/v$version" >/dev/null; then
            echo "v$version is tagged here, so release.yml has published it or is publishing it now."
            exit 0
          fi

          index='https://api.nuget.org/v3-flatcontainer/zphil.loadbearing.cli/index.json'
          body="$RUNNER_TEMP/flatcontainer.json"
          code="$(curl -sS --retry 3 --retry-delay 2 --retry-all-errors --max-time 30 -o "$body" -w '%{http_code}' "$index")" || code=''
          if [ "$code" != '200' ]; then
            echo "::error::nuget.org did not answer $index (${code:-no response}), so whether $version is published is unknown. That is a registry or network failure, not a manifest defect — re-run this job."
            exit 1
          fi

          if jq -e --arg v "$version" '.versions | index($v)' "$body" > /dev/null; then
            echo "$version is on nuget.org and carries no v$version tag here — a release tagged before this gate existed, or a tag that was never pushed."
            exit 0
          fi

          echo "::error::.mcp/server.json advertises $version, which nuget.org does not serve and no v$version tag here will publish. Every MCP registry client reading this manifest would ask dnx for a version that 404s. Push the tag alongside the branch — 'git push origin main v$version' — or return the manifest to the published version."
          jq -r '"published: " + (.versions | join(", "))' "$body"
          exit 1

  # Self-scan: LoadBearing checks its own solution and publishes the result to GitHub code
  # scanning as SARIF. The self-spec exits 0 today, so the job is green; a future violation
  # reddens the check step and the alerts still upload (if: always()). Forked-PR and
  # Dependabot runs lack the security-events token, so the upload is guarded off for them.
  self-check:
    runs-on: ubuntu-latest
    permissions:
      contents: read           # checkout
      security-events: write   # upload SARIF to code scanning
    steps:
      # fetch-depth: 0 so origin/main exists as a local ref for --diff-base below; the default
      # single-commit checkout leaves nothing to diff against.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'
      # Relock for Dependabot NuGet PRs. Identical text in build-and-test, which carries the
      # rationale; the local commit is what keeps the unscoped `git diff --exit-code` below honest.
      - name: Regenerate NuGet lock files (Dependabot NuGet PRs)
        if: startsWith(github.head_ref, 'dependabot/nuget/')
        shell: bash
        env:
          CI: ''
        run: |
          dotnet restore Zphil.LoadBearing.slnx --force-evaluate
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- '*packages.lock.json'
          git diff --cached --quiet || git commit -q -m 'Regenerate NuGet lock files'
      # Build the whole solution (CLI + the arch spec) so --no-build can run the check over
      # the real MSBuildWorkspace, exactly as build-and-test does. --spec is explicit: the
      # self-solution has many Core-referencing members, so the one-spec convention cannot
      # pick (the self-spec test passes the same path).
      - name: Build
        run: dotnet build Zphil.LoadBearing.slnx
      # --diff-base arms the Quarantine tripwire: a change set touching roslyn/msbuild-bootstrap
      # draws a warning naming the file, which is the recommended CI shape and the one this
      # repository owed its own quarantined scope. Without the flag the tripwire reports skipped
      # on every run. Warnings never move the exit code, so this cannot redden CI on its own;
      # containment, which needs no diff, already could. On a push to main origin/main is HEAD
      # and the diff is empty; on a pull request it is the base tip, so the warning covers
      # exactly the proposed change.
      - name: Check self and emit SARIF
        run: dotnet run --no-build --project src/Zphil.LoadBearing.Cli -- check Zphil.LoadBearing.slnx --spec arch/Zphil.LoadBearing.ArchSpec/Zphil.LoadBearing.ArchSpec.csproj --diff-base origin/main --sarif loadbearing.sarif
      # The same self-spec through the xUnit adapter, as its own step so the log reads one line per rule
      # ID — the run the landing page's xUnit beat links. The 3-OS matrix already runs these tests inside
      # the full suite; this leg exists to be readable, not to add coverage.
      - name: Self-spec as named xUnit tests (one test per rule)
        run: dotnet test tests/Zphil.LoadBearing.Tests/Zphil.LoadBearing.Tests.csproj --no-build --filter "FullyQualifiedName~AdapterSelfSpecTests" --logger "console;verbosity=normal"
      # Render this repo's own spec and require a zero diff — the same provably-current property the
      # examples job holds, now over the root block, the diagram, and the whole class of per-directory
      # cards. The command is character-for-character the one ARCHITECTURE.md publishes as the way to
      # redraw it, so the documented reproduce line is an executed one rather than a claim. The diff is
      # unscoped on purpose: a card placed somewhere nobody predicted still has to be committed, and a
      # path list here would quietly stop covering it. Cost: render pays two extractions (scoped cards,
      # then the diagram with no project exclusions) on top of check's one. Accepted — this is the only
      # leg that runs `render` against this solution at all.
      - name: Render self and assert a single zero diff
        run: |
          dotnet run --no-build --project src/Zphil.LoadBearing.Cli -- render Zphil.LoadBearing.slnx \
            --spec arch/Zphil.LoadBearing.ArchSpec/Zphil.LoadBearing.ArchSpec.csproj \
            --diagram ARCHITECTURE.md \
            --diagram-only "Zphil.LoadBearing;Zphil.LoadBearing.Cli;Zphil.LoadBearing.Roslyn;Zphil.LoadBearing.Xunit;Zphil.LoadBearing.Packs.DotNet;Zphil.LoadBearing.ArchSpec"
          git diff --exit-code
      # The read verbs, against this solution. `check` used to be the only command that ever ran on this
      # repository under any gate; a shipped verb nobody points at its own codebase is a verb whose first
      # real consumer is a stranger. With render above, that leaves only `baseline`, which stays out
      # deliberately — it is the human escape valve, and a gate that ran it would be moving the ratchet.
      # Exit 0 is the whole assertion — red rules never fail `status` or `graph`, and `explain` needs no
      # workspace — so this is a smoke test, not a second check. Since 2026-08-04 it does carry one real
      # assertion beyond "the command ran": `status` and `graph` exit 2 on a workspace that loaded only
      # partially, so exit 0 here says this solution loads completely on the runner.
      - name: Read verbs against this solution (status, graph, explain)
        run: |
          dotnet run --no-build --project src/Zphil.LoadBearing.Cli -- status Zphil.LoadBearing.slnx --spec arch/Zphil.LoadBearing.ArchSpec/Zphil.LoadBearing.ArchSpec.csproj
          dotnet run --no-build --project src/Zphil.LoadBearing.Cli -- graph Zphil.LoadBearing.slnx
          dotnet run --no-build --project src/Zphil.LoadBearing.Cli -- explain layering/model-independent Zphil.LoadBearing.slnx --spec arch/Zphil.LoadBearing.ArchSpec/Zphil.LoadBearing.ArchSpec.csproj
      - name: Upload SARIF to code scanning
        if: always() && (github.event_name != 'pull_request' || (!github.event.pull_request.head.repo.fork && github.actor != 'dependabot[bot]'))
        uses: github/codeql-action/upload-sarif@f205ea1c3313d32999d8d6a48b4f6530d4437b38 # v4.37.4
        with:
          sarif_file: loadbearing.sarif
          category: loadbearing

  # Provably-current examples: build each example solution, run `check` (exit 0 on the
  # committed baselines), then re-run `render` for all of them and assert a single zero diff
  # across examples/ — root blocks AND the scoped per-directory cards. If a spec drifts from
  # its example code, this job fails. The Meridian.Quoting on-ramp also runs its xUnit
  # adapter (one named test per rule). Ubuntu-only initially.
  examples:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'
      # Relock for Dependabot NuGet PRs, so the CLI build below is of the bump. Identical text in
      # build-and-test, which carries the rationale.
      - name: Regenerate NuGet lock files (Dependabot NuGet PRs)
        if: startsWith(github.head_ref, 'dependabot/nuget/')
        shell: bash
        env:
          CI: ''
        run: |
          dotnet restore Zphil.LoadBearing.slnx --force-evaluate
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- '*packages.lock.json'
          git diff --cached --quiet || git commit -q -m 'Regenerate NuGet lock files'
      # The CLI never builds the target; build the example solutions first. Examples restore
      # unlocked (no lock policy under examples/); CLI/src restore locked via committed lock files.
      - name: Build the Meridian example solution
        run: dotnet build examples/Meridian/Meridian.slnx
      - name: Build the Meridian.Quoting example solution
        run: dotnet build examples/Meridian.Quoting/Meridian.Quoting.slnx
      - name: Build the Meridian.Operations example solution
        run: dotnet build examples/Meridian.Operations/Meridian.Operations.slnx
      - name: Build the Meridian.Interchange example solution
        run: dotnet build examples/Meridian.Interchange/Meridian.Interchange.slnx
      - name: Build the LoadBearing CLI
        run: dotnet build src/Zphil.LoadBearing.Cli/Zphil.LoadBearing.Cli.csproj
      - name: Check Meridian (expect exit 0 on the committed baselines)
        run: dotnet run --no-build --project src/Zphil.LoadBearing.Cli -- check examples/Meridian/Meridian.slnx
      - name: Check Meridian.Quoting (expect exit 0; Enforce-only, no baselines)
        run: dotnet run --no-build --project src/Zphil.LoadBearing.Cli -- check examples/Meridian.Quoting/Meridian.Quoting.slnx
      - name: Check Meridian.Operations (expect exit 0 on the committed containment baseline)
        run: dotnet run --no-build --project src/Zphil.LoadBearing.Cli -- check examples/Meridian.Operations/Meridian.Operations.slnx
      - name: Check Meridian.Interchange (expect exit 0 on the committed baseline)
        run: dotnet run --no-build --project src/Zphil.LoadBearing.Cli -- check examples/Meridian.Interchange/Meridian.Interchange.slnx
      # No --no-build here: the adapter test project is not a member of any slnx, so nothing
      # above builds it. dotnet test restores and builds it (and the Xunit adapter it references).
      - name: Test the Meridian.Quoting xUnit adapter (one named test per rule)
        run: dotnet test examples/Meridian.Quoting/tests/Meridian.Quoting.ArchTests/Meridian.Quoting.ArchTests.csproj --logger "console;verbosity=normal"
      - name: Render all four and assert a single zero diff (the provably-current property)
        run: |
          dotnet run --no-build --project src/Zphil.LoadBearing.Cli -- render examples/Meridian/Meridian.slnx
          dotnet run --no-build --project src/Zphil.LoadBearing.Cli -- render examples/Meridian.Quoting/Meridian.Quoting.slnx
          dotnet run --no-build --project src/Zphil.LoadBearing.Cli -- render examples/Meridian.Operations/Meridian.Operations.slnx
          dotnet run --no-build --project src/Zphil.LoadBearing.Cli -- render examples/Meridian.Interchange/Meridian.Interchange.slnx
          git diff --exit-code -- examples/

  # The one check a Dependabot NuGet PR is meant to fail. Every job above relocks so it can test the
  # bump; this one relocks and requires a zero diff, so the PR carries real signal about the update
  # and exactly one red naming the command that closes it.
  #
  # It runs on every pull request, not only Dependabot's. Locked mode is CI-only, so an ordinary
  # local restore keeps the lock files current by itself and a human PR arrives clean; one that does
  # not is a lock file somebody forgot to commit, and NU1004 would otherwise be the first anyone
  # heard of it on main.
  lock-files:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'
      # CI: '' for the same reason as the relock step in build-and-test: in locked mode this restore
      # would fail rather than rewrite the files this job exists to compare. The remedy is a command
      # rather than an artifact, so the summary carries the fix and nothing is uploaded.
      #
      # Two questions, because a diff answers only one of them. `git diff` names a committed lock
      # file the projects have moved away from; `ls-files --others` names one that was never added
      # at all, which is what a lock file for a newly locked project looks like and what a diff is
      # structurally blind to. Both are "somebody forgot to commit this".
      - name: Regenerate the lock files and require a zero diff
        env:
          CI: ''
        run: |
          dotnet restore Zphil.LoadBearing.slnx --force-evaluate
          stale="$(git diff --name-only -- '*packages.lock.json'; git ls-files --others --exclude-standard -- '*packages.lock.json')"
          if [ -z "$stale" ]; then exit 0; fi
          {
            echo '### NuGet lock files are out of date'
            echo
            echo 'These `packages.lock.json` no longer match the projects, or are not committed at all:'
            echo
            printf '%s\n' "$stale" | sed 's/^/- `/; s/$/`/'
            echo
            echo 'Regenerate them on this branch and push:'
            echo
            echo '```'
            echo 'dotnet restore Zphil.LoadBearing.slnx --force-evaluate'
            echo 'git add -- "*packages.lock.json"'
            echo 'git commit -m "Regenerate NuGet lock files"'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          echo '::error::NuGet lock files are out of date — see the job summary for the fix'
          git diff -- '*packages.lock.json'
          exit 1
